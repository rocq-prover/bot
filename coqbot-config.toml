[bot]
name="coqbot"
email="coqbot@users.noreply.github.com"

[server]
domain="coqbot.herokuapp.com"

[github]
app_id="31373"

[gitlab]
  [gitlab.com]
  domain="gitlab.com"
  api_token_env_var="GITLAB_ACCESS_TOKEN"

  [gitlab.inria]
  domain="gitlab.inria.fr"
  api_token_env_var="INRIA_GITLAB_ACCESS_TOKEN"
  bot_name="x-CBot"

[mappings]
  [mappings.rocq]
  github="rocq-prover/rocq"
  gitlab="coq/coq"
  gitlab_domain="gitlab.inria.fr"

  [mappings.opam]
  github="rocq-prover/opam"
  gitlab="coq/opam-repositories"
  gitlab_domain="gitlab.inria.fr"

  [mappings.math-comp]
  github="math-comp/math-comp"
  gitlab="math-comp/math-comp"
  gitlab_domain="gitlab.inria.fr"

  [mappings.docker-mathcomp]
  github="math-comp/docker-mathcomp"
  gitlab="math-comp/docker-mathcomp"
  gitlab_domain="gitlab.inria.fr"

[repositories]
 [repositories.rocq]
 github = "rocq-prover/rocq"
 gitlab_domain = "gitlab.inria.fr"
 gitlab_owner = "coq"
 gitlab_repo = "coq"
 github_installation_id = 1062161
 org_name = "rocq-prover"
 # Full GitHub @-mention used when the bot needs to alert someone
 alert_mention = "@rocq-prover/coqbot-maintainers"
 minimizer_url = "https://github.com/rocq-community/run-coq-bug-minimizer/actions"

 [repositories.rocq.backporting]
 github_project_number = 11

 [[repositories.rocq.teams]]
 team_name = "contributors"
 permission = "trigger_ci"

 [[repositories.rocq.teams]]
 team_name = "pushers"
 permission = "merge_pr"

 [repositories.rocq.jobs]
 # GitLab CI job name handled by bench status/results logic
 bench_job = "bench"
 # Use Rocq-specific failure summaries / allow-failure handling
 use_rocq_job_status = true
 # Ignore missing Docker image manifest errors in CI traces
 silence_docker_manifest_errors = true
 # Successful jobs that get a GitHub status check linking to doc artifacts
 doc_artifact_jobs = [
  "doc:refman", "doc:ci-refman", "doc:init",
  "doc:stdlib", "doc:stdlib:dune", "doc:ml-api:odoc"
 ]

 [repositories.opam]
 github = "rocq-prover/opam"
 gitlab_domain = "gitlab.inria.fr"
 gitlab_owner = "coq"
 gitlab_repo = "opam"

 [repositories.docker-rocq-prover]
 github = "rocq-prover/docker-rocq"
 gitlab_domain = "gitlab.inria.fr"
 gitlab_owner = "coq"
 gitlab_repo = "docker-rocq"

 [repositories.math-comp]
 github = "math-comp/math-comp"
 gitlab_domain = "gitlab.inria.fr"
 gitlab_owner = "math-comp"
 gitlab_repo = "math-comp"

 [repositories.docker-mathcomp]
 github = "math-comp/docker-mathcomp"
 gitlab_domain = "gitlab.inria.fr"
 gitlab_owner = "math-comp"
 gitlab_repo = "docker-mathcomp"

 [repositories.docker-base]
 github = "rocq-community/docker-base"
 gitlab_domain = "gitlab.com"
 gitlab_owner = "rocq-community"
 gitlab_repo = "docker-base"

 [repositories.docker-coq]
 github = "rocq-community/docker-coq"
 gitlab_domain = "gitlab.com"
 gitlab_owner = "rocq-community"
 gitlab_repo = "docker-coq"

 [repositories.docker-rocq-community]
 github = "rocq-community/docker-rocq"
 gitlab_domain = "gitlab.com"
 gitlab_owner = "rocq-community"
 gitlab_repo = "docker-rocq"