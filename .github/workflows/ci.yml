name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Create dummy token file for dune
        run: echo "dummy" > bot-components/.github-token
      - name: Build and test
        run: nix-shell --run "dune runtest"
