name: Update GraphQL schemas

on:
  schedule:
    # Monthly on the 1st at 06:00 UTC (schemas change roughly every 3 months)
    - cron: "0 6 1 */3 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # dune @update-schema for GitHub reads bot-components/.github-token
      - name: Write GitHub token for schema fetch
        run: printf '%s\n' "${{ github.token }}" > bot-components/.github-token

      - name: Refresh schemas
        run: nix-shell --run "dune build @update-schema"

      - name: Detect schema changes
        id: changes
        run: |
          if git diff --quiet -- \
            bot-components/github/github-schema.json \
            bot-components/gitlab/gitlab-schema.json
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CI checks
        if: steps.changes.outputs.changed == 'true'
        id: ci
        continue-on-error: true
        run: nix-shell --run "dune build @fmt && dune build @runtest"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          commit-message: "chore: refresh GraphQL schemas"
          title: "chore: refresh GraphQL schemas"
          body: |
            Automated refresh of committed GitHub and GitLab GraphQL schemas
            (`dune build @update-schema`).

            CI ran in the update workflow before this PR was opened. If that job
            failed, schema drift likely broke `graphql_ppx` typing (nullable
            fields, renames, deprecations) and needs a manual code fix before
            merge.
          branch: chore/update-graphql-schemas
          delete-branch: true
          labels: dependencies

      - name: Merge pull request
        if: >-
          steps.changes.outputs.changed == 'true' &&
          steps.ci.outcome == 'success' &&
          steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash \
            "${{ steps.cpr.outputs.pull-request-number }}"
